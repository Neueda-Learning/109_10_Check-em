name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 109_10_Check-em/frontend/shopflow-payments-main

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 109_10_Check-em/frontend/shopflow-payments-main/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build the App
        env:
          NITRO_PRESET: node-server
        run: npm run build

      - name: Login to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Build Docker Image
        if: github.event_name == 'push'
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:8082 \
            --build-arg NITRO_PRESET=node-server \
            -t ghcr.io/neueda-learning/checkem-ui:latest .

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/neueda-learning/checkem-ui:latest

      - name: Trigger Jenkins CD
        if: github.event_name == 'push'
        run: |
          curl -X POST \
            "${{ secrets.JENKINS_URL }}/buildByToken/build?job=checkem-ui-deploy-job&token=${{ secrets.JENKINS_TOKEN }}"
