services:
  mysql:
    image: mysql:8.4
    container_name: checkem-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: n3u3da!
      MYSQL_DATABASE: payflow
    ports:
      - "3306:3306"
    volumes:
      - checkem-mysql-data:/var/lib/mysql
      - ./109_10_Check-em/backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pn3u3da!"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/neueda-learning/checkem-api:latest
    container_name: checkem-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payflow
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: n3u3da!
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_H2_CONSOLE_ENABLED: "false"
      PAYFLOW_ROUTING_SEED_ENABLED: "true"
    ports:
      - "8082:8080"

  ui:
    image: ghcr.io/neueda-learning/checkem-ui:latest
    container_name: checkem-ui
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"
    pull_policy: always

volumes:
  checkem-mysql-data:
